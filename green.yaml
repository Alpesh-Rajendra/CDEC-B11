apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-app-dep
spec: 
  replicas: 2
  selector:
   matchLabels: 
    app: green
  template: 
   metadata:
     name: tmp-game
     labels:
       app: green
   spec:
      containers:
       - name: c1
         image: abhipraydh96/green
         ports:
         - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: green-stdapp-dep
spec: 
  selector: 
   app: green
  ports:
   - protocol: TCP
     port: 80
     targetPort: 80
  type: NodePort 
  

---
